<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Merchant Book</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-box">
      <h1>Merchant Book</h1>
      <input id="gate-input" type="password" placeholder="Пароль" autocomplete="current-password" />
      <button id="gate-btn">Войти</button>
      <div id="gate-error" class="gate-error"></div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <strong>Merchant Book</strong>
      <span class="market">HTX · CNY</span>
      <button id="reload-btn">↻ Обновить</button>
      <button id="lock-btn" title="Заблокировать (спросит пароль снова)">🔒</button>
    </header>

    <section class="filters">
      <select id="f-side"><option value="buy">Покупают USDT</option><option value="sell">Продают USDT</option></select>
      <input id="search" type="search" placeholder="Поиск: имя / uid / контакт / тег" />
      <input id="f-amount" type="number" placeholder="Сумма сделки" />
      <select id="f-pay"><option value="">Все способы</option></select>
      <select id="f-level"><option value="">Любой уровень</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select>
      <select id="f-sort">
        <option value="price:desc" selected>Цена ↓</option>
        <option value="price:asc">Цена ↑</option>
        <option value="tradeCount:desc">Сделок ↓</option>
        <option value="orderCompleteRate:desc">% завершения ↓</option>
        <option value="merchantLevel:desc">Уровень ↓</option>
      </select>
      <label><input id="f-nickname" type="checkbox" /> С никнеймами</label>
      <label><input id="f-tags" type="checkbox" /> С тегами</label>
      <label><input id="f-contacts" type="checkbox" /> С контактами</label>
      <input id="f-tag" type="text" placeholder="Тег" list="tag-list" />
      <datalist id="tag-list"></datalist>
    </section>

    <div id="status" class="status"></div>
    <main id="list" class="list"></main>
    <div id="more-wrap"><button id="more-btn" hidden>Загрузить ещё</button></div>
    <aside id="detail" class="detail" hidden></aside>
  </div>

  <!-- ?v= — cache-bust для мобильных браузеров; БУМПАТЬ при изменении JS (и v в импортах main.js/ui-*) -->
  <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
